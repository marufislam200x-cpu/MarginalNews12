
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marginal News | Newsroom Admin</title>
<style>
:root{--red:#c4161c;--ink:#202020;--muted:#666;--line:#ddd}
*{box-sizing:border-box}
body{margin:0;background:#f3f3f3;color:var(--ink);font:15px Arial,sans-serif}
header{background:#171717;color:white;padding:18px 5%;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
header strong{font-size:22px}
header span{color:#ddd;font-size:13px}
main{max-width:1050px;margin:30px auto;padding:0 16px}
.panel{background:white;border:1px solid var(--line);border-radius:9px;padding:22px;margin-bottom:20px}
h2{margin:0 0 18px}
label{display:block;font-weight:bold;margin:14px 0 6px}
input,textarea,select{width:100%;padding:11px;border:1px solid #bbb;border-radius:5px;font:inherit}
textarea{min-height:180px;resize:vertical}
button{border:0;border-radius:5px;padding:11px 16px;background:var(--red);color:white;font-weight:bold;cursor:pointer}
button.secondary{background:#333}
button.danger{background:#777}
button:disabled{opacity:.5;cursor:wait}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.story{border-top:1px solid var(--line);padding:15px 0;display:flex;justify-content:space-between;gap:15px;align-items:center}
.story h3{margin:0 0 6px}
.meta{color:var(--muted);font-size:13px}
#message{margin-top:12px;color:#176b36}
#login{max-width:420px;margin:70px auto}
.hidden{display:none!important}
@media(max-width:650px){.row{grid-template-columns:1fr}.story{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>

<header>
  <div>
    <strong>MARGINAL NEWS</strong><br>
    <span>Newsroom Management System</span>
  </div>
  <div id="headerActions" class="hidden">
    <button class="secondary" id="download">Download Subscribers</button>
    <button class="secondary" id="logout">Log out</button>
  </div>
</header>

<main>
  <section id="login" class="panel">
    <h2>Admin Login</h2>
    <p class="meta">Enter your newsroom administrator password.</p>
    <label for="password">Admin Password</label>
    <input id="password" type="password" placeholder="Enter password">
    <div class="actions">
      <button id="loginBtn">Sign in</button>
    </div>
    <p id="loginMessage" class="meta"></p>
  </section>

  <section id="dashboard" class="hidden">
    <div class="panel">
      <h2 id="formTitle">Create a News Story</h2>

      <form id="storyForm">
        <input type="hidden" id="storyId">

        <label for="title">Headline *</label>
        <input id="title" required maxlength="180" placeholder="Write the news headline">

        <label for="summary">Short Summary *</label>
        <textarea id="summary" required maxlength="500" style="min-height:85px" placeholder="Write a short introduction"></textarea>

        <label for="body">Full News Content *</label>
        <textarea id="body" required placeholder="Write the full news report"></textarea>

        <div class="row">
          <div>
            <label for="sec">Category *</label>
            <select id="sec" required>
              <option value="intl">International News</option>
              <option value="geo">Geopolitics</option>
              <option value="eco">Global Economy</option>
              <option value="sci">Science & Technology</option>
              <option value="env">Climate & Environment</option>
              <option value="edu">Education</option>
              <option value="fact">Fact-Check</option>
              <option value="read">Long Read</option>
              <option value="op">Opinion</option>
            </select>
          </div>
          <div>
            <label for="author">Author / Reporter</label>
            <input id="author" placeholder="Marginal News Desk">
          </div>
        </div>

        <div class="row">
          <div>
            <label for="status">Publication Status</label>
            <select id="status">
              <option value="draft">Draft</option>
              <option value="published">Published</option>
            </select>
          </div>
          <div>
            <label for="publishAt">Schedule (optional)</label>
            <input id="publishAt" type="datetime-local">
          </div>
        </div>

        <label>
          <input id="featured" type="checkbox" style="width:auto">
          Feature this story on the homepage
        </label>

        <div class="actions">
          <button type="submit" id="saveBtn">Save Story</button>
          <button type="button" class="secondary" id="resetBtn">Clear Form</button>
        </div>
        <p id="message" role="status"></p>
      </form>
    </div>

    <div class="panel">
      <h2>Newsroom Stories</h2>
      <div class="actions">
        <button class="secondary" id="refresh">Refresh Stories</button>
      </div>
      <div id="storiesList" class="meta">Loading stories...</div>
    </div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
let adminPassword = "";
let stories = [];

function apiHeaders() {
  return {
    "Content-Type": "application/json",
    "x-admin-password": adminPassword
  };
}

function showLogin() {
  $("login").classList.remove("hidden");
  $("dashboard").classList.add("hidden");
  $("headerActions").classList.add("hidden");
}

function showDashboard() {
  $("login").classList.add("hidden");
  $("dashboard").classList.remove("hidden");
  $("headerActions").classList.remove("hidden");
}

async function login() {
  const password = $("password").value;
  if (!password) {
    $("loginMessage").textContent = "Enter your password.";
    return;
  }

  adminPassword = password;
  $("loginBtn").disabled = true;
  $("loginMessage").textContent = "Checking password...";

  try {
    const response = await fetch("/api/stories", {
      headers: apiHeaders()
    });

    if (response.status === 401) {
      throw new Error("Incorrect password.");
    }
    if (!response.ok) {
      throw new Error("Could not connect to the news server.");
    }

    stories = await response.json();
    showDashboard();
    renderStories();
  } catch (error) {
    adminPassword = "";
    $("loginMessage").textContent = error.message;
  } finally {
    $("loginBtn").disabled = false;
  }
}

function clearForm() {
  $("storyForm").reset();
  $("storyId").value = "";
  $("formTitle").textContent = "Create a News Story";
  $("saveBtn").textContent = "Save Story";
  $("message").textContent = "";
}

function editStory(id) {
  const story = stories.find(item => item.id === id);
  if (!story) return;

  $("storyId").value = story.id;
  $("title").value = story.title || "";
  $("summary").value = story.summary || "";
  $("body").value = story.body || "";
  $("sec").value = story.sec || "intl";
  $("author").value = story.author || "";
  $("status").value = story.status || "draft";
  $("featured").checked = !!story.featured;

  if (story.publishAt) {
    const date = new Date(story.publishAt);
    $("publishAt").value =
      new Date(date.getTime() - date.getTimezoneOffset() * 60000)
      .toISOString().slice(0, 16);
  } else {
    $("publishAt").value = "";
  }

  $("formTitle").textContent = "Edit News Story";
  $("saveBtn").textContent = "Update Story";
  window.scrollTo({ top: 0, behavior: "smooth" });
}

async function loadStories() {
  $("storiesList").textContent = "Loading stories...";

  try {
    const response = await fetch("/api/stories", {
      headers: apiHeaders()
    });

    if (response.status === 401) {
      logout();
      throw new Error("Please sign in again.");
    }
    if (!response.ok) throw new Error("Could not load stories.");

    stories = await response.json();
    renderStories();
  } catch (error) {
    $("storiesList").textContent = error.message;
  }
}

function renderStories() {
  if (!stories.length) {
    $("storiesList").textContent = "No stories yet. Create your first story above.";
    return;
  }

  $("storiesList").innerHTML = stories.map(story => `
    <div class="story">
      <div>
        <h3>${escapeHTML(story.title)}</h3>
        <div class="meta">
          ${escapeHTML(story.sec || "News")} ·
          ${escapeHTML(story.status || "draft")} ·
          ${escapeHTML(story.author || "Marginal News Desk")}
        </div>
      </div>
      <div class="actions">
        <button class="secondary" data-edit="${escapeHTML(story.id)}">Edit</button>
        <button class="danger" data-delete="${escapeHTML(story.id)}">Delete</button>
      </div>
    </div>
  `).join("");
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

$("storyForm").addEventListener("submit", async event => {
  event.preventDefault();

  const id = $("storyId").value;
  const publishValue = $("publishAt").value;

  const story = {
    id: id || undefined,
    title: $("title").value.trim(),
    summary: $("summary").value.trim(),
    body: $("body").value.trim(),
    sec: $("sec").value,
    author: $("author").value.trim() || "Marginal News Desk",
    status: $("status").value,
    featured: $("featured").checked,
    publishAt: publishValue ? new Date(publishValue).toISOString() : ""
  };

  $("saveBtn").disabled = true;
  $("message").textContent = "Saving story...";

  try {
    const response = await fetch("/api/stories", {
      method: id ? "PUT" : "POST",
      headers: apiHeaders(),
      body: JSON.stringify(story)
    });

    const result = await response.json();
    if (!response.ok) throw new Error(result.error || "Could not save story.");

    $("message").textContent = "Story saved successfully.";
    clearForm();
    await loadStories();
  } catch (error) {
    $("message").textContent = error.message;
  } finally {
    $("saveBtn").disabled = false;
  }
});

$("storiesList").addEventListener("click", async event => {
  const editButton = event.target.closest("[data-edit]");
  const deleteButton = event.target.closest("[data-delete]");

  if (editButton) {
    editStory(editButton.dataset.edit);
  }

  if (deleteButton) {
    const id = deleteButton.dataset.delete;
    if (!confirm("Are you sure you want to delete this story?")) return;

    try {
      const response = await fetch("/api/stories", {
        method: "DELETE",
        headers: apiHeaders(),
        body: JSON.stringify({ id })
      });

      const result = await response.json();
      if (!response.ok) throw new Error(result.error || "Delete failed.");

      await loadStories();
    } catch (error) {
      alert(error.message);
    }
  }
});

async function downloadSubscribers() {
  try {
    const response = await fetch("/api/subscribe", {
      headers: apiHeaders()
    });

    if (!response.ok) throw new Error("Could not download subscriber list.");

    const blob = await response.blob();
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = "marginal-news-subscribers.csv";
    link.click();
    URL.revokeObjectURL(url);
  } catch (error) {
    alert(error.message);
  }
}

function logout() {
  adminPassword = "";
  $("password").value = "";
  $("loginMessage").textContent = "";
  clearForm();
  showLogin();
}

$("loginBtn").addEventListener("click", login);
$("password").addEventListener("keydown", event => {
  if (event.key === "Enter") login();
});
$("logout").addEventListener("click", logout);
$("download").addEventListener("click", downloadSubscribers);
$("refresh").addEventListener("click", loadStories);
$("resetBtn").addEventListener("click", clearForm);
</script>
</body>
</html>
