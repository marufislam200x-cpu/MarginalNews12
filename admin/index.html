
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marginal News | Admin Dashboard</title>
<style>
:root{--red:#c4161c;--dark:#171717;--bg:#f4f4f4;--line:#ddd}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#222;font:15px Arial,sans-serif}
header{background:var(--dark);color:white;padding:18px 5%;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
header strong{font-size:22px}
main{max-width:1100px;margin:28px auto;padding:0 15px}
.panel{background:white;border:1px solid var(--line);border-radius:10px;padding:22px;margin-bottom:20px}
h2{margin-top:0}
label{display:block;font-weight:bold;margin:14px 0 6px}
input,textarea,select{width:100%;padding:11px;border:1px solid #bbb;border-radius:5px;font:inherit}
textarea{min-height:150px;resize:vertical}
input[type=checkbox]{width:auto}
button{border:0;border-radius:5px;padding:11px 16px;background:var(--red);color:white;font-weight:bold;cursor:pointer}
button.secondary{background:#333}
button.danger{background:#777}
button:disabled{opacity:.5}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.story{border-top:1px solid var(--line);padding:16px 0;display:flex;justify-content:space-between;gap:15px;align-items:center}
.story h3{margin:0 0 7px}
.meta{color:#777;font-size:13px}
.hidden{display:none!important}
#login{max-width:430px;margin:65px auto}
#loginMessage,#message{margin-top:12px;color:#b21b20}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat{background:white;border:1px solid var(--line);padding:16px;border-radius:8px}
.stat strong{display:block;font-size:25px;color:var(--red);margin-top:7px}
@media(max-width:650px){.row,.stats{grid-template-columns:1fr 1fr}.story{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>

<header>
  <div>
    <strong>MARGINAL NEWS</strong><br>
    <span>Newsroom Management System</span>
  </div>
  <div id="headerActions" class="hidden actions">
    <button class="secondary" id="download">Download Subscribers</button>
    <button class="secondary" id="logout">Log out</button>
  </div>
</header>

<main>
  <section id="login" class="panel">
    <h2>Admin Login</h2>
    <p class="meta">Sign in to manage Marginal News.</p>
    <label for="password">Admin Password</label>
    <input id="password" type="password" placeholder="Enter admin password">
    <div class="actions">
      <button id="loginBtn">Sign in</button>
    </div>
    <p id="loginMessage" aria-live="polite"></p>
  </section>

  <section id="dashboard" class="hidden">

    <div class="stats">
      <div class="stat">Total Stories<strong id="totalStories">0</strong></div>
      <div class="stat">Published<strong id="publishedStories">0</strong></div>
      <div class="stat">Drafts<strong id="draftStories">0</strong></div>
      <div class="stat">Scheduled<strong id="scheduledStories">0</strong></div>
    </div>

    <div class="panel">
      <h2 id="formTitle">Create a News Story</h2>

      <form id="storyForm">
        <input type="hidden" id="storyId">

        <label for="title">Headline *</label>
        <input id="title" required maxlength="180" placeholder="Write news headline">

        <label for="summary">Short Summary *</label>
        <textarea id="summary" required maxlength="500" style="min-height:85px" placeholder="Write a short summary"></textarea>

        <label for="body">Full News Content *</label>
        <textarea id="body" required placeholder="Write full news content"></textarea>

        <div class="row">
          <div>
            <label for="sec">Category *</label>
            <select id="sec" required>
              <option value="Bangladesh">Bangladesh</option>
              <option value="Politics">Politics</option>
              <option value="World">World</option>
              <option value="Business">Business</option>
              <option value="Sports">Sports</option>
              <option value="Technology">Technology</option>
              <option value="Education">Education</option>
              <option value="Culture">Culture</option>
              <option value="Opinion">Opinion</option>
              <option value="Environment">Environment</option>
              <option value="Long Read">Long Read</option>
              <option value="Fact-Check">Fact-Check</option>
            </select>
          </div>
          <div>
            <label for="author">Author / Reporter</label>
            <input id="author" placeholder="Marginal News Desk">
          </div>
        </div>

        <label for="image">News Image URL</label>
        <input id="image" type="url" placeholder="https://example.com/image.jpg">

        <div class="row">
          <div>
            <label for="status">Publication Status</label>
            <select id="status">
              <option value="draft">Draft</option>
              <option value="published">Published</option>
            </select>
          </div>
          <div>
            <label for="publishAt">Schedule Publication (optional)</label>
            <input id="publishAt" type="datetime-local">
          </div>
        </div>

        <label><input id="featured" type="checkbox"> Feature on Homepage</label>
        <label><input id="editorsPick" type="checkbox"> Mark as Editor's Pick</label>

        <div class="actions">
          <button type="submit" id="saveBtn">Save Story</button>
          <button type="button" class="secondary" id="resetBtn">Clear Form</button>
        </div>
        <p id="message" role="status"></p>
      </form>
    </div>

    <div class="panel">
      <h2>Newsroom Stories</h2>
      <div class="actions">
        <button class="secondary" id="refresh">Refresh Stories</button>
      </div>
      <div id="storiesList" class="meta">Loading stories...</div>
    </div>

  </section>
</main>

<script>
const $ = id => document.getElementById(id);
let adminPassword = "";
let stories = [];

const oldCategories = {
  intl:"World",
  geo:"Politics",
  eco:"Business",
  sci:"Technology",
  env:"Environment",
  edu:"Education",
  fact:"Fact-Check",
  read:"Long Read",
  op:"Opinion"
};

function headers(){
  return {
    "Content-Type":"application/json",
    "x-admin-password":adminPassword
  };
}

async function api(url,options={}){
  const response = await fetch(url,{
    ...options,
    headers:{...headers(),...(options.headers||{})}
  });

  if(response.status===401){
    logout();
    throw new Error("Session expired or incorrect password. Please sign in again.");
  }

  return response;
}

function showDashboard(){
  $("login").classList.add("hidden");
  $("dashboard").classList.remove("hidden");
  $("headerActions").classList.remove("hidden");
}

function showLogin(){
  $("login").classList.remove("hidden");
  $("dashboard").classList.add("hidden");
  $("headerActions").classList.add("hidden");
}

async function login(){
  const password=$("password").value.trim();

  if(!password){
    $("loginMessage").textContent="Please enter your password.";
    return;
  }

  adminPassword=password;
  $("loginBtn").disabled=true;
  $("loginMessage").textContent="Checking password...";

  try{
    const response=await fetch("/api/stories",{
      headers:headers()
    });

    if(!response.ok){
      throw new Error(response.status===401?"Incorrect password.":"Server connection failed.");
    }

    stories=await response.json();
    showDashboard();
    renderStories();
  }catch(error){
    adminPassword="";
    $("loginMessage").textContent=error.message;
  }finally{
    $("loginBtn").disabled=false;
  }
}

function updateStats(){
  const now=Date.now();

  $("totalStories").textContent=stories.length;
  $("publishedStories").textContent=stories.filter(s=>
    s.status==="published" && (!s.publishAt || new Date(s.publishAt).getTime()<=now)
  ).length;
  $("draftStories").textContent=stories.filter(s=>s.status==="draft").length;
  $("scheduledStories").textContent=stories.filter(s=>
    s.status==="published" && s.publishAt && new Date(s.publishAt).getTime()>now
  ).length;
}

function escapeHTML(value){
  return String(value??"").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);
}

function renderStories(){
  updateStats();

  if(!stories.length){
    $("storiesList").textContent="No stories yet. Create your first story.";
    return;
  }

  $("storiesList").innerHTML=stories.map(story=>`
    <div class="story">
      <div>
        <h3>${escapeHTML(story.title)}</h3>
        <div class="meta">
          ${escapeHTML(story.category||oldCategories[story.sec]||story.sec||"News")}
          · ${escapeHTML(story.status||"draft")}
          · ${escapeHTML(story.author||"Marginal News Desk")}
        </div>
      </div>
      <div class="actions">
        <button class="secondary" data-edit="${escapeHTML(story.id)}">Edit</button>
        <button class="danger" data-delete="${escapeHTML(story.id)}">Delete</button>
      </div>
    </div>
  `).join("");
}

async function loadStories(){
  $("storiesList").textContent="Loading stories...";

  try{
    const response=await api("/api/stories");
    if(!response.ok)throw new Error("Could not load stories.");

    stories=await response.json();
    renderStories();
  }catch(error){
    $("storiesList").textContent=error.message;
  }
}

function clearForm(){
  $("storyForm").reset();
  $("storyId").value="";
  $("formTitle").textContent="Create a News Story";
  $("saveBtn").textContent="Save Story";
  $("message").textContent="";
}

function editStory(id){
  const story=stories.find(item=>String(item.id)===String(id));
  if(!story)return;

  $("storyId").value=story.id;
  $("title").value=story.title||"";
  $("summary").value=story.summary||"";
  $("body").value=story.body||"";

  const category=story.category||oldCategories[story.sec]||story.sec||"Bangladesh";
  $("sec").value=category;

  if(!$("sec").value)$("sec").value="Bangladesh";

  $("author").value=story.author||"";
  $("image").value=story.image||"";
  $("status").value=story.status||"draft";
  $("featured").checked=!!story.featured;
  $("editorsPick").checked=!!story.editorsPick;

  if(story.publishAt){
    const date=new Date(story.publishAt);
    $("publishAt").value=new Date(
      date.getTime()-date.getTimezoneOffset()*60000
    ).toISOString().slice(0,16);
  }else{
    $("publishAt").value="";
  }

  $("formTitle").textContent="Edit News Story";
  $("saveBtn").textContent="Update Story";
  window.scrollTo({top:0,behavior:"smooth"});
}

$("storyForm").addEventListener("submit",async event=>{
  event.preventDefault();

  const id=$("storyId").value;
  const publishValue=$("publishAt").value;

  const story={
    id:id||undefined,
    title:$("title").value.trim(),
    summary:$("summary").value.trim(),
    body:$("body").value.trim(),
    sec:$("sec").value,
    category:$("sec").value,
    author:$("author").value.trim()||"Marginal News Desk",
    image:$("image").value.trim(),
    status:$("status").value,
    featured:$("featured").checked,
    editorsPick:$("editorsPick").checked,
    publishAt:publishValue?new Date(publishValue).toISOString():""
  };

  $("saveBtn").disabled=true;
  $("message").textContent="Saving story...";

  try{
    const response=await api("/api/stories",{
      method:id?"PUT":"POST",
      body:JSON.stringify(story)
    });

    const result=await response.json();
    if(!response.ok)throw new Error(result.error||"Could not save story.");

    $("message").textContent="Story saved successfully.";
    clearForm();
    await loadStories();
  }catch(error){
    $("message").textContent=error.message;
  }finally{
    $("saveBtn").disabled=false;
  }
});

$("storiesList").addEventListener("click",async event=>{
  const edit=event.target.closest("[data-edit]");
  const remove=event.target.closest("[data-delete]");

  if(edit){
    editStory(edit.dataset.edit);
    return;
  }

  if(remove){
    const id=remove.dataset.delete;
    if(!confirm("Are you sure you want to delete this story?"))return;

    try{
      const response=await api("/api/stories",{
        method:"DELETE",
        body:JSON.stringify({id})
      });

      const result=await response.json();
      if(!response.ok)throw new Error(result.error||"Delete failed.");

      await loadStories();
    }catch(error){
      alert(error.message);
    }
  }
});

async function downloadSubscribers(){
  try{
    const response=await api("/api/subscribe");
    if(!response.ok)throw new Error("Could not download subscribers.");

    const blob=await response.blob();
    const url=URL.createObjectURL(blob);
    const link=document.createElement("a");
    link.href=url;
    link.download="marginal-news-subscribers.csv";
    link.click();
    URL.revokeObjectURL(url);
  }catch(error){
    alert(error.message);
  }
}

function logout(){
  adminPassword="";
  $("password").value="";
  $("loginMessage").textContent="";
  clearForm();
  showLogin();
}

$("loginBtn").addEventListener("click",login);
$("password").addEventListener("keydown",event=>{
  if(event.key==="Enter")login();
});
$("logout").addEventListener("click",logout);
$("download").addEventListener("click",downloadSubscribers);
$("refresh").addEventListener("click",loadStories);
$("resetBtn").addEventListener("click",clearForm);
</script>
</body>
</html>
